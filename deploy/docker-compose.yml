services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-home-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data

  hue:
    build: ../adapters/hue
    container_name: hue
    env_file:
      - ../adapters/hue/.env
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
